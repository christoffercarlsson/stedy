[package]
publish = false
name = "stedy"
version = "1.0.0-rc.1"
edition = "2021"

description = "Easy-to-use primitives for modern cryptographic tools and protocols"
keywords = [
    "cryptography",
    "primitives",
    "encryption",
    "signatures",
    "hashing"
]
repository = "https://github.com/christoffercarlsson/stedy"

authors = ["Christoffer Carlsson <cc@christoffercarlsson.com>"]
license = "MIT"

[features]
default = []
docs = ["getrandom", "hazmat", "secret_sharing"]
ffi = ["getrandom"]
getrandom = ["dep:getrandom"]
hazmat = []
secret_sharing = []

[dependencies]
getrandom = { version = "0.3.4", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.1"

[profile.release]
debug = false
debug-assertions = false
lto = true
opt-level = 3
overflow-checks = false
strip = true

[profile.ffi]
inherits = "release"
codegen-units = 1
panic = "abort"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["docs"]

[lib]
name = "stedy"

[[bench]]
name = "stedy"
harness = false
path = "benchmarks/main.rs"
